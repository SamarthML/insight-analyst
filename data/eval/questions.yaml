# Insight Analyst — RAG evaluation set (DRAFT, pending review)
#
# Every expected_answer below was extracted verbatim from the corpus, and every
# ground_truth chunk_index was located by searching the built BM25 index for
# that exact sentence. Nothing here is written from memory. Figures are quoted
# as the filings state them.
#
# HOW TO EDIT
#   - Correct, discard or replace freely; ids need not stay contiguous.
#   - `page: -1` means the source is a text file with no pagination (the
#     NO_PAGE sentinel in src/config.py). PDFs carry their real page number.
#   - `chunk_index` values are positions in the current 16,917-chunk index.
#     They are ONLY valid while chunking settings stay at 250/40. Re-chunking
#     invalidates them; the `quote` field is the durable anchor and can be
#     re-located automatically.
#   - `answerable: false` marks questions whose answer is genuinely absent from
#     the corpus. Verified by checking the BM25 vocabulary, not by assumption:
#     "toyota", "boeing" and "pfizer" appear in no chunk. Note that "tesla",
#     "amazon", "openai" and "bitcoin" DO appear, so they cannot be used here.
#   - `ambiguous: true` marks questions that under-specify company or period.
#     There is no single correct answer; the system should ask for
#     clarification or state which entity/period it assumed.
#   - Some `quote` values are trimmed mid-sentence on purpose. The filings use
#     curly apostrophes (U+2019), so "The Company's" will not match an ASCII
#     quote, and PDF extraction sometimes drops spaces ("Districts inlate
#     November"). Quotes are cut to spans that match the corpus byte-for-byte.
#
# CATEGORY COUNTS: exact_fact 13 | conceptual 9 | adversarial 6  (28 total)

meta:
  corpus_chunks: 16917
  chunking: "250 tokens / 40 overlap"
  embedding_model: "BAAI/bge-small-en-v1.5"
  status: final

questions:

  # ==========================================================================
  # EXACT FACT — specific figures from SEC 10-K filings
  # ==========================================================================

  - id: ef-01
    category: exact_fact
    question: "What was NVIDIA's total revenue in fiscal year 2024, and how much did it grow?"
    expected_answer: "$60.9 billion, up 126% from the prior year."
    quote: "Revenue for fiscal year 2024 was $60.9 billion, up 126% from a year ago."
    ground_truth:
      - {source: sec_10k_nvda_2024-02-21.txt, page: -1, chunk_index: 228}
      - {source: sec_10k_nvda_2024-02-21.txt, page: -1, chunk_index: 229}

  - id: ef-02
    category: exact_fact
    question: "By how much did NVIDIA's Data Center revenue grow in fiscal year 2024?"
    expected_answer: "Data Center revenue was up 217% in fiscal year 2024."
    quote: "Data Center revenue for fiscal year 2024 was up 217%."
    ground_truth:
      - {source: sec_10k_nvda_2024-02-21.txt, page: -1, chunk_index: 229}

  - id: ef-03
    category: exact_fact
    question: "What was NVIDIA's revenue in fiscal year 2026?"
    expected_answer: "$215.9 billion, up 65% from the prior year."
    quote: "Revenue for fiscal year 2026 was $215.9 billion, up 65% from a year ago."
    ground_truth:
      - {source: sec_10k_nvda_2026-02-25.txt, page: -1, chunk_index: 233}
      - {source: sec_10k_nvda_2026-02-25.txt, page: -1, chunk_index: 234}

  - id: ef-04
    category: exact_fact
    question: "How did Apple's total net sales change in fiscal 2023 compared with 2022?"
    expected_answer: "Total net sales decreased 3%, or $11.0 billion, during 2023 compared to 2022."
