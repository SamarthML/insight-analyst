    notes: "This is the query that exposed the BM25 possessive bug. Keep it."

  - id: ef-05
    category: exact_fact
    question: "How much did Microsoft's revenue increase in fiscal year 2024?"
    expected_answer: "Revenue increased $33.2 billion, or 16%, with growth across each segment."
    quote: "Revenue increased $33.2 billion or 16% driven by growth across each of our segments."
    ground_truth:
      - {source: sec_10k_msft_2024-07-30.txt, page: -1, chunk_index: 245}

  - id: ef-06
    category: exact_fact
    question: "How much did Microsoft's revenue increase in fiscal year 2025?"
    expected_answer: "Revenue increased $36.6 billion, or 15%, with growth across each segment."
    quote: "Revenue increased $36.6 billion or 15% with growth across each of our segments."
    ground_truth:
      - {source: sec_10k_msft_2025-07-30.txt, page: -1, chunk_index: 216}
    notes: "ef-05/06/07 are near-identical in wording and differ only by year and
      figure. Deliberate: they test whether retrieval discriminates between
      filings rather than returning whichever Microsoft revenue chunk ranks first."

  - id: ef-07
    category: exact_fact
    question: "How much did Microsoft's revenue increase in fiscal year 2026?"
    expected_answer: "Revenue increased $50.1 billion, or 18%, driven by growth in Microsoft Cloud."
    quote: "Revenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud."
    ground_truth:
      - {source: sec_10k_msft_2026-07-29.txt, page: -1, chunk_index: 219}

  - id: ef-08
    category: exact_fact
    question: "What net income did JPMorgan Chase report for 2023, and what was earnings per share?"
    expected_answer: "Net income of $49.6 billion for 2023, up 32%, with earnings per share of $16.23."
    quote: "JPMorgan Chase reported net income of $49.6 billion for 2023, up 32%, earnings per share of $16.23"
    ground_truth:
      - {source: sec_10k_jpm_2024-02-16.txt, page: -1, chunk_index: 641}

  - id: ef-09
    category: exact_fact
    question: "What was JPMorganChase's net income and ROTCE for 2024?"
    expected_answer: "Net income of $58.5 billion, up 18%, with ROE of 18% and ROTCE of 22%. EPS was $19.75."
    quote: "JPMorganChase reported net income of $58.5 billion for 2024, up 18%, earnings per share of $19.75, ROE of 18% and ROTCE of 22%."
    ground_truth:
      - {source: sec_10k_jpm_2025-02-14.txt, page: -1, chunk_index: 640}

  - id: ef-10
    category: exact_fact
    question: "Did JPMorganChase's net income rise or fall in 2025, and by how much?"
    expected_answer: "It fell. Net income was $57.0 billion for 2025, down 2%, with EPS of $20.02."
    quote: "JPMorganChase reported net income of $57.0 billion for 2025, down 2%, earnings per share of $20.02"
    ground_truth:
      - {source: sec_10k_jpm_2026-02-13.txt, page: -1, chunk_index: 628}
    notes: "Tests direction-of-change, not just figure lookup. EPS rose while net
      income fell, so a careless answer can easily contradict itself."

  - id: ef-11
    category: exact_fact
    question: "What was JPMorganChase's Standardized CET1 capital ratio requirement, including regulatory buffers, as of December 31, 2024?"
    expected_answer: "12.3%."
