    ground_truth:
      - {source: sec_10k_jpm_2025-02-14.txt, page: -1, chunk_index: 805}
    notes: "The requirement, not the actual ratio. A system that conflates the two
      is wrong even if it returns a plausible percentage."

  - id: ef-12
    category: exact_fact
    question: "What were Coca-Cola's net operating revenues in 2024?"
    expected_answer: "$47,061 million in 2024, compared with $45,754 million in 2023 — an increase of $1,307 million, or 3%."
    quote: "Net operating revenues were $47,061 million in 2024, compared to $45,754 million in 2023, an increase of $1,307 million, or 3%."
    ground_truth:
      - {source: sec_10k_ko_2025-02-20.txt, page: -1, chunk_index: 377}

  - id: ef-13
    category: exact_fact
    question: "What were Coca-Cola's net operating revenues in 2025 and how did they compare with 2024?"
    expected_answer: "$47,941 million in 2025, compared with $47,061 million in 2024 — an increase of $880 million, or 2%."
    quote: "Net operating revenues were $47,941 million in 2025, compared to $47,061 million in 2024, an increase of $880 million, or 2%."
    ground_truth:
      - {source: sec_10k_ko_2026-02-20.txt, page: -1, chunk_index: 382}

  # ==========================================================================
  # CONCEPTUAL — themes and outlook from Beige Book / BIS / World Bank
  # ==========================================================================

  - id: co-01
    category: conceptual
    question: "How did the Federal Reserve characterize overall economic activity in the January 2025 Beige Book?"
    expected_answer: "Economic activity increased slightly to moderately across the twelve Federal Reserve Districts in late November and December."
    quote: "Economic activity increased slightly to moderately across the twelve Federal Reserve Districts"
    ground_truth:
      - {source: fed_beige_book_20250115.pdf, page: 5, chunk_index: 7}

  - id: co-02
    category: conceptual
    question: "What did the June 2025 Beige Book say about the direction of economic activity?"
    expected_answer: "Economic activity had declined slightly since the previous report, with half of the Districts reporting declines."
    quote: "economic activity has declined"
    ground_truth:
      - {source: fed_beige_book_20250604.pdf, page: 5, chunk_index: 7}
    notes: "Pairs with co-01 as a direction reversal. If retrieval cannot separate
      two Beige Books six months apart, it will answer one with the other."

  - id: co-03
    category: conceptual
    question: "How were labor market conditions described in the June 2025 Beige Book?"
    expected_answer: "Employment had been little changed since the previous report."
    quote: "Labor MarketsEmployment has been little changed since the previous"
    ground_truth:
      - {source: fed_beige_book_20250604.pdf, page: 5, chunk_index: 8}

  - id: co-04
    category: conceptual
    question: "What did the World Bank estimate for global growth in 2025?"
    expected_answer: "Global growth is estimated to have averaged 2.7 percent in 2025, 0.4 percentage point above the June projections."
    quote: "global growth is estimated to have averaged 2.7 percent in 2025"
    ground_truth:
      - {source: worldbank_global_economic_prospects_2026_01.pdf, page: 27, chunk_index: 60}
      - {source: worldbank_global_economic_prospects_2026_01.pdf, page: 27, chunk_index: 61}

  - id: co-05
    category: conceptual
    question: "What is the World Bank's projection for global growth in 2027, and what drives it?"
    expected_answer: "Global growth is projected to edge up to 2.7 percent in 2027 as trade flows adjust and policy uncertainty wanes, supported by improving domestic demand."
    quote: "Global growth is projected to edge up to 2.7 percent in 2027, as trade flows adjust and policy uncertainty wanes."
    ground_truth:
      - {source: worldbank_global_economic_prospects_2026_01.pdf, page: 53, chunk_index: 227}
      - {source: worldbank_global_economic_prospects_2026_01.pdf, page: 53, chunk_index: 228}
    notes: "Same 2.7 percent figure as co-04 but a different year and meaning
      (estimate for 2025 vs projection for 2027). Tests whether the system
      distinguishes them or collapses them into one fact."

  - id: co-06
    category: conceptual
    question: "How has debt distress risk changed for fragile and conflict-affected economies?"
    expected_answer: "The share rose from 26 percent in 2015 to about 50 percent in 2026; FCS economies have become particularly vulnerable to debt distress."
    quote: "rose from 26 percent in 2015 to about 50 percent in 2026"
    ground_truth:
      - {source: worldbank_global_economic_prospects_2026_06.pdf, page: 110, chunk_index: 539}
      - {source: worldbank_global_economic_prospects_2026_06.pdf, page: 110, chunk_index: 540}

  - id: co-07
    category: conceptual
    question: "Why did major central banks delay raising interest rates after inflation began rising in early 2021?"
    expected_answer: "They began lifting rates only about a year later, partly because of uncertainty about whether the inflation would persist after a long period of very subdued price increases."
    quote: "major central banks began to lift rates only one year later, partly due to uncertainty about its persistence"
    ground_truth:
      - {source: bis_annual_economic_report_2024.pdf, page: 31, chunk_index: 110}

  - id: co-08
    category: conceptual
    question: "According to the BIS, what role did central bank credibility play in controlling inflation?"
    expected_answer: "The commitment to bringing inflation under control signalled to markets, firms and workers that the central bank would do what it took, which helped restrain inflation alongside an increase in supply."
    quote: "the commitment to bringing inflation under control provided a strong signal to markets, firms and workers"
    ground_truth:
      - {source: bis_annual_economic_report_2024.pdf, page: 66, chunk_index: 270}

  - id: co-09
    category: conceptual
    question: "How did the tone of the Beige Book change over the course of 2025?"
    expected_answer: "It deteriorated. Activity increased slightly to moderately in the January report, but by June activity had declined slightly, with half of Districts reporting declines."
    quote: null
    ground_truth:
      - {source: fed_beige_book_20250115.pdf, page: 5, chunk_index: 7}
      - {source: fed_beige_book_20250604.pdf, page: 5, chunk_index: 7}
    notes: "MULTI-DOCUMENT. Requires synthesising two reports, so context recall
      needs both chunks. Expect this to be the hardest item in the set and a good
      test of whether fusion surfaces more than one document."

  # ==========================================================================
  # ADVERSARIAL — should NOT produce a confident answer
  # ==========================================================================

  - id: adv-01
    category: adversarial
    subtype: unanswerable
    answerable: false
    question: "What was Toyota's operating income in its most recent fiscal year?"
    expected_answer: "NOT ANSWERABLE. The corpus contains no Toyota filings or data; the system should say so rather than answer."
    ground_truth: []
    notes: "Verified: the token 'toyota' appears in no chunk of the index."

  - id: adv-02
    category: adversarial
    subtype: unanswerable
    answerable: false
    question: "How much did Boeing spend on research and development last year?"
    expected_answer: "NOT ANSWERABLE. Boeing does not appear anywhere in the corpus."
    ground_truth: []
    notes: "Verified: the token 'boeing' appears in no chunk of the index."

  - id: adv-03
    category: adversarial
    subtype: unanswerable
    answerable: false
    question: "What is Pfizer's current dividend per share?"
    expected_answer: "NOT ANSWERABLE. Pfizer does not appear anywhere in the corpus."
    ground_truth: []
    notes: "Verified absent. Note the tempting near-miss: 'dividend' IS in the
      corpus, so retrieval will happily return dividend chunks about other
      companies. This tests whether the answerer notices the entity mismatch."

  - id: adv-04
    category: adversarial
    subtype: ambiguous
    ambiguous: true
    question: "What was revenue growth?"
    expected_answer: "AMBIGUOUS. No company or period is specified; the corpus covers five companies across multiple years. The system should ask which, or state clearly which it assumed."
    ground_truth: []

  - id: adv-05
    category: adversarial
    subtype: ambiguous
    ambiguous: true
    question: "What are the main risk factors?"
    expected_answer: "AMBIGUOUS. Five companies file risk factors in this corpus. The system should ask which company, or state its assumption."
    ground_truth: []

  - id: adv-06
    category: adversarial
    subtype: ambiguous
    ambiguous: true
    question: "What was the CET1 capital ratio?"
    expected_answer: "AMBIGUOUS but narrowable. Only JPMorganChase reports CET1 here, so the company is inferable, but the corpus holds three filings (2023, 2024, 2025) and the answer differs by year. The system should name the year it used."
    ground_truth: []
    notes: "Partially resolvable ambiguity, unlike adv-04/05. Good test of whether
      the system over-refuses when context does narrow the question."
